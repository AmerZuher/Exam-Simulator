<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="120" height="120" role="img" aria-label="ExamPro logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- badge background, edge-to-edge -->
  <rect width="100" height="100" rx="24" fill="url(#bg)"/>

  <!-- progress ring: same mark as the app favicon / PWA icon -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="50" cy="50" r="34" stroke-width="6" stroke-dasharray="154 60" transform="rotate(-90 50 50)" opacity="0.95"/>
    <path stroke-width="11" d="M31 52l14 14 25-30"/>
  </g>
</svg>
